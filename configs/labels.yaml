# C3 label configuration (DESIGN §5.3 tiers, §5.4 label rule, §7.3 output columns).

W: 3                          # look-back window, primary (an assumption: fraud onset is unobservable)
W_sensitivity: [1, 2, 5]      # EXPERIMENT_PLAN S1
primary_tier: primary
# Snapshot date that bounds the label horizon. null = as_of of the newest registered `current` LEIE file.
snapshot_date: null

# Providers excluded under some authority, but not under the tier being labelled. DESIGN §5.4 says
# "never-excluded providers are unlabelled negatives", so they are not negatives: drop all their rows.
# (Alternative `negative` exists only for a sensitivity run; changing the default needs a §17 entry.)
other_excluded_policy: drop

# Canonical authority codes (OIG exclusion-authorities page, verified in design §18).
tiers:
  primary:        # fraud-related
    ["1128(a)(1)", "1128(a)(3)", "1128(b)(1)(A)", "1128(b)(6)", "1128(b)(7)", "1128(b)(16)"]
  prior_work:     # FAU (Khoshgoftaar group) label set, EXPERIMENT_PLAN S11
    ["1128(a)(1)", "1128(a)(2)", "1128(a)(3)", "1128(b)(4)", "1128(b)(7)", "1128(c)(3)(G)(i)", "1128(c)(3)(G)(ii)"]
  primary_b1:     # G1 decision (D117): primary + the unsplit 1128(b)(1), sensitivity S13 only
    ["1128(a)(1)", "1128(a)(3)", "1128(b)(1)(A)", "1128(b)(6)", "1128(b)(7)", "1128(b)(16)", "1128(b)(1)"]
  broad:          # primary + these, EXPERIMENT_PLAN S2
    ["1128(a)(1)", "1128(a)(3)", "1128(b)(1)(A)", "1128(b)(6)", "1128(b)(7)", "1128(b)(16)",
     "1128(b)(2)", "1128(b)(5)", "1128(b)(8)", "1128(b)(15)", "1156", "1128(a)(4)", "1128(b)(3)"]
# Listed for the record (DESIGN §5.3): neither positive nor negative in the primary analysis.
removed: ["1128(a)(2)", "1128(b)(4)", "1128(b)(14)", "1128(b)(9)", "1128(b)(10)", "1128(b)(11)",
          "1128(b)(12)", "1128(b)(13)"]

# Mandatory exclusions carry a 5-year minimum (DESIGN §5.4 point 3); used in the reinstatement-loss report.
mandatory: ["1128(a)(1)", "1128(a)(2)", "1128(a)(3)", "1128(a)(4)"]

# ---------------------------------------------------------------------------------------------------------
# LEIE file layout and EXCLTYPE encoding.
# NOT YET VERIFIED against the OIG record-layout PDF (HANDOFF §7; DESIGN §5.3 "confirmed in Phase 1").
# Column names and the raw EXCLTYPE strings below are background knowledge. The labeller fails on any
# EXCLTYPE value that is not listed, so the real file forces this table to be checked before labels exist.
# After checking: set verified: true and record the PDF in the manifest (kind: record_layout).
# Phase 0: the 18-column header (LASTNAME ... WVRSTATE) matches third-party captures of the live file
# (2026-08) exactly; dates are YYYYMMDD with "00000000" for empty; a missing NPI is "0000000000".
# Phase 1 (real UPDATED.csv of 09-2026, downloaded 2026-10-19, and the OIG record-layout PDF): same 18 columns
# in the PDF's order (the PDF names the last one WAIVERSTATE); an empty NPI, REINDATE or WAIVERDATE is written
# as a single "0"; 8,924 of 84,093 records carry an NPI.
# Supplements dated May 2013 or earlier lack the NPI and waiver fields (OIG), so the reader rejects them.
leie_layout:
  verified: true
  columns:
    npi: NPI
    excltype: EXCLTYPE
    excldate: EXCLDATE
    reindate: REINDATE
    lastname: LASTNAME
    firstname: FIRSTNAME
    midname: MIDNAME
    busname: BUSNAME
    dob: DOB
    state: STATE
    general: GENERAL
    specialty: SPECIALTY
  date_format: "%Y%m%d"
  empty_dates: ["", "0", "00000000"]
  empty_npi: ["", "0", "0000000000"]

# Raw EXCLTYPE -> canonical authority. Keys are matched after normalisation: whitespace, "(", ")", "§"
# and "." removed; case kept, because "1128A" (civil monetary penalties) differs from "1128a".
#
# Phase 0 evidence (design/LITERATURE_REVIEW.md §1; third-party copies of 2022-2026 full files and of the
# 2024-25 monthly supplements, not the OIG files themselves): the values that occur are 1128a1-a4,
# 1128b1-b8, 1128b11, 1128b12, 1128b14-b16, 1128Aa, 1156, 1160, "BRCH CIA", "BRCH SA"; older full files
# pad them with spaces to 9 characters (stripped on read). The OIG record-layout PDF gives field names and
# lengths only, so the meaning of each code comes from the OIG exclusion-authorities page.
# Keep verified: false until the first real download confirms there is no unmapped value.
# Phase 1: the real 09-2026 UPDATED.csv and the 42 monthly supplements (2025-01 to 2026-09) contain only the 22
# codes listed in Phase 0 (1128b1 unsplit, D71); every one maps below.
excltype_map:
  verified: true
  map:
    "1128a1": "1128(a)(1)"
    "1128a2": "1128(a)(2)"
    "1128a3": "1128(a)(3)"
    "1128a4": "1128(a)(4)"
    # Never observed in Phase 0: the file uses the unsplit "1128b1". Kept in case a future file splits it.
    "1128b1A": "1128(b)(1)(A)"
    "1128b1a": "1128(b)(1)(A)"
    "1128b1B": "1128(b)(1)(B)"
    "1128b1b": "1128(b)(1)(B)"
    # G1 DECISION NEEDED: the primary tier names 1128(b)(1)(A) (misdemeanour health-care fraud), but the
    # file only carries the unsplit 1128(b)(1), which also covers (b)(1)(B) (fraud in other government
    # programs). Decided at G1 (D71, D117): an unsplit 1128b1 stays out of the primary tier ("other excluded", rows
    # dropped) and is tested in sensitivity S13 (tier primary_b1).
    "1128b1": "1128(b)(1)"
    "1128b2": "1128(b)(2)"
    "1128b3": "1128(b)(3)"
    "1128b4": "1128(b)(4)"
    "1128b5": "1128(b)(5)"
    "1128b6": "1128(b)(6)"
    "1128b7": "1128(b)(7)"
    "1128b8": "1128(b)(8)"
    "1128b9": "1128(b)(9)"
    "1128b10": "1128(b)(10)"
    "1128b11": "1128(b)(11)"
    "1128b12": "1128(b)(12)"
    "1128b13": "1128(b)(13)"
    "1128b14": "1128(b)(14)"
    "1128b15": "1128(b)(15)"
    "1128b16": "1128(b)(16)"
    # Never observed in Phase 0 (no file encoding found); the prior-work tier's (c)(3)(G) entries may be moot.
    "1128c3Gi": "1128(c)(3)(G)(i)"
    "1128c3gi": "1128(c)(3)(G)(i)"
    "1128c3Gii": "1128(c)(3)(G)(ii)"
    "1128c3gii": "1128(c)(3)(G)(ii)"
    "1128Aa": "1128A(a)"
    "1156": "1156"
    "1160": "1160"       # observed in 2022-23 full files (Phase 0); in no tier
    "BRCHCIA": "breach-CIA"
    "BRCHSA": "breach-SA"
