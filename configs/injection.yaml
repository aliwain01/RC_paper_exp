# C6 scheme injection (DESIGN §7.7; EXPERIMENT_PLAN §6; CONTRACTS §5). Intensities are the plan's starting values;
# Phase 5 calibration proposes new ones and the human accepts them at gate G5.

seed: 20261018
draws: 5                      # EXPERIMENT_PLAN §6: 5 independent draws

# Answer key per scheme (DESIGN §17 D90): `groups` = the scheme group(s) that count as correct; `spill` = groups the
# transform is expected to touch too (spill-over profile, EXPERIMENT_PLAN §5.1); `primary_feature` = the feature the
# calibration targets ("medium" near the peer 95th percentile).
schemes:
  upcoding:
    groups: [upcoding]
    spill: [charge_inflation]
    primary_feature: UP2
    intensities: {low: 0.15, medium: 0.30, high: 0.50}     # p: share of 99212-13 services moved to 99214-15
  overutilization:
    groups: [overutilization]
    spill: [charge_inflation, patient_mix]
    primary_feature: OU1
    intensities: {low: 1.3, medium: 1.6, high: 2.0}        # m: multiplier on non-drug services
  atypical_mix:
    groups: [atypical_mix]
    spill: [overutilization, charge_inflation]
    primary_feature: SM2
    intensities: {low: 0.10, medium: 0.20, high: 0.35}     # q: payment share in codes rare in the peer cell
  charge_inflation:
    groups: [charge_inflation]
    spill: []
    primary_feature: CH1
    intensities: {low: 1.3, medium: 1.7, high: 2.2}        # c: multiplier on submitted charges
  dme_mill:
    # "DME mill referrals" add high-risk DME volume (DME referral intensity) filled by 1-2 suppliers (DME referral
    # concentration): both groups count as correct.
    groups: [dme_intensity, dme_concentration]
    spill: []
    primary_feature: DI1
    intensities: {low: 2.0, medium: 4.0, high: 8.0}        # d: added DME spend as a multiple of the peer-cell median

pairs:
  - [upcoding, overutilization]
  - [overutilization, atypical_mix]
  - [upcoding, charge_inflation]
  - [dme_mill, overutilization]
pair_intensity: medium

test:
  years: [2022, 2023]
  per_cell: 300               # per scheme x intensity
  per_pair: 300               # per pair (medium)
train:
  years: [2018, 2021]
  share: 0.005                # ≈ 0.5 % of training provider-years, split evenly across scheme x intensity cells and pairs

pools:
  upcoding_min_established: 50      # ≥ 50 visible established-visit services (99211-99215)
  dme_specialty_referrer_share: 0.20

transforms:
  upcoding: {from: ["99212", "99213"], to: {"99214": 0.5, "99215": 0.5}}   # D91: split of moved services
  atypical: {n_codes: 3, min_national_providers: 10}
  dme: {n_codes: 2, suppliers: [1, 2], min_national_providers: 5}
  min_new_row_benes: 11       # added rows get >= 11 beneficiaries so they survive suppression

# Re-suppression of edited service-level rows (CMS: records from <= 10 beneficiaries are excluded). DMEPOS: the real
# 2018-2024 files (Phase 1) keep only rows with >= 11 claims and blank beneficiary counts below 11 (70 % of DME-S
# rows in 2023 have a blank Tot_Suplr_Benes), so DME-S rows are re-suppressed on claims (DESIGN §17 D114, §18).
suppression:
  cms_ps: {field: tot_benes, max_suppressed: 10}
  dme_s: {field: tot_suplr_clms, max_suppressed: 10}

distractor:
  percentile: 0.95            # EXPERIMENT_PLAN §5.1: already above the peer 95th percentile in a different group

calibration:
  year: 2021                  # a training year
  sample_per_scheme: 200
  target_percentile: 0.95
  grid:
    upcoding: [0.05, 0.10, 0.15, 0.20, 0.30, 0.40, 0.50, 0.70]
    overutilization: [1.1, 1.2, 1.3, 1.45, 1.6, 1.8, 2.0, 2.5]
    atypical_mix: [0.03, 0.05, 0.10, 0.15, 0.20, 0.25, 0.35, 0.50]
    charge_inflation: [1.1, 1.2, 1.3, 1.5, 1.7, 2.0, 2.2, 2.6]
    dme_mill: [0.5, 1.0, 2.0, 3.0, 4.0, 6.0, 8.0, 12.0]

# Injection models (use b): one per family, the LEIE models' tuned parameters, seed 0 (reference).
families: [lr, ebm, ga2m, xgb, xgb_mono, lgbm, lgbm_mono]
attribution_baselines: [peer]
