         Rfrg_Prvdr_Gndr, Rfrg_Prvdr_St1, Rfrg_Prvdr_St2, Rfrg_Prvdr_City, Rfrg_Prvdr_Zip5,
         Rfrg_Prvdr_State_FIPS, Rfrg_Prvdr_RUCA_Desc, Rfrg_Prvdr_Cntry]
