# Scheme groups (DESIGN §7.5, Fig. 4; FEATURE_CATALOG; CONTRACTS §2.2). Fixed before modelling; one group
# per feature. Order is fixed: G0 context, G1-G7 the seven scheme groups. Context is a model input and is
# never shown as a reason. One-hot context columns are matched by prefix (CXn__<value>).
groups:
  - {id: G0, name: context, features: [CX5, CX7, CX8], prefixes: [CX1__, CX2__, CX3__, CX4__, CX6__]}
  - {id: G1, name: upcoding, features: [UP0, UP1, UP2, UP3, UP4, UP5, UP6]}
  - {id: G2, name: overutilization, features: [OU1, OU2, OU3, OU4, OU5]}
  - {id: G3, name: atypical_mix, features: [SM1, SM2, SM3, SM4]}
  - {id: G4, name: charge_inflation, features: [CH1, CH2, CH3, CH4]}
  - {id: G5, name: patient_mix, features: [PM1, PM2, PM3, PM4, PM4_missing]}
  - {id: G6, name: dme_intensity, features: [DI0, DI1, DI2, DI2_missing, DI3, DI4]}
  - {id: G7, name: dme_concentration, features: [DC1, DC2]}

# Grouping variants for the sensitivity suite (EXPERIMENT_PLAN §7): feature ID -> group it moves to.
variants:
  S7: {CH2: overutilization, PM1: context}
